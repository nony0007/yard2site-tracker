<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yard2Site Tracker</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bulma/0.9.3/css/bulma.min.css">
  <script src="https://unpkg.com/html5-qrcode@2.3.6/html5-qrcode.min.js"></script>
  <style>
    body { padding: 20px; }
    .hidden { display: none; }
    .navbar-item.is-active { font-weight: bold; }
    .table-container { overflow-x: auto; }
  </style>
</head>
<body>
  <h1 class="title">Yard2Site Tracker</h1>
  <h2 class="subtitle">Internal material tracking system</h2>

  <div id="login">
    <h2 class="title is-4">Login</h2>
    <div class="field">
      <label class="label">Username</label>
      <div class="control">
        <input class="input" id="username" placeholder="Enter username">
      </div>
    </div>
    <div class="field">
      <label class="label">PIN</label>
      <div class="control">
        <input class="input" id="pin" type="password" placeholder="Enter PIN">
      </div>
    </div>
    <button class="button is-primary" onclick="login()">Login</button>
  </div>

  <div id="dashboard" class="hidden">
    <h2 class="title is-4">Dashboard</h2>
    <div class="tabs">
      <ul id="navTabs"></ul>
    </div>

    <!-- Inventory Tab -->
    <div id="inventoryTab" class="tab-content">
      <div class="field">
        <label class="checkbox">
          <input type="checkbox" id="hideZeroCheckbox" onchange="toggleHideZero()"> Hide zero stock
        </label>
      </div>
      <div class="table-container">
        <table class="table is-striped is-fullwidth">
          <thead>
            <tr>
              <th>Item</th>
              <th>Size</th>
              <th>Quantity</th>
              <th>Site</th>
              <th>Acquired</th>
              <th>Cost (€)</th>
              <th>Rented</th>
              <th>Rental Start</th>
              <th>Rate (€/day)</th>
              <th>Rental Cost (€)</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="inventoryTableBody"></tbody>
        </table>
      </div>
    </div>

    <!-- Add Item Tab -->
    <div id="addItemTab" class="tab-content hidden">
      <h3 class="title is-5">Add Item</h3>
      <div class="field">
        <label class="label">Name</label>
        <div class="control">
          <input class="input" id="itemName">
        </div>
      </div>
      <div class="field">
        <label class="label">Size/Model</label>
        <div class="control">
          <input class="input" id="itemSize">
        </div>
      </div>
      <div class="field">
        <label class="label">Quantity</label>
        <div class="control">
          <input class="input" type="number" id="itemQty">
        </div>
      </div>
      <div class="field">
        <label class="label">Site</label>
        <div class="control">
          <input class="input" id="itemSite" placeholder="e.g., Main Yard or Site Name">
        </div>
      </div>
      <div class="field">
        <label class="label">Acquisition Date</label>
        <div class="control">
          <input class="input" type="date" id="itemAcqDate">
        </div>
      </div>
      <div class="field">
        <label class="label">Acquisition Cost (€)</label>
        <div class="control">
          <input class="input" type="number" step="0.01" id="itemAcqCost">
        </div>
      </div>
      <div class="field">
        <label class="checkbox">
          <input type="checkbox" id="itemIsRented" onchange="toggleRentalFields()"> Rented
        </label>
      </div>
      <div class="field" id="rentalStartField" style="display:none">
        <label class="label">Rental Start Date</label>
        <div class="control">
          <input class="input" type="date" id="itemRentalStart">
        </div>
      </div>
      <div class="field" id="rentalRateField" style="display:none">
        <label class="label">Rental Rate (€/day)</label>
        <div class="control">
          <input class="input" type="number" step="0.01" id="itemRentalRate">
        </div>
      </div>
      <button class="button is-primary" onclick="addItem()">Add Item</button>
    </div>

    <!-- Request Tab -->
    <div id="requestTab" class="tab-content hidden">
      <h3 class="title is-5">Request Delivery</h3>
      <div class="field">
        <label class="label">Item Name</label>
        <div class="control">
          <input class="input" id="requestItemName" placeholder="Enter item name">
        </div>
      </div>
      <div class="field">
        <label class="label">Quantity</label>
        <div class="control">
          <input class="input" type="number" id="requestQty">
        </div>
      </div>
      <div class="field">
        <label class="label">Need By Date</label>
        <div class="control">
          <input class="input" type="date" id="requestDate">
        </div>
      </div>
      <button class="button is-primary" onclick="requestDelivery()">Submit Request</button>
    </div>

    <!-- Scan Tab -->
    <div id="scanTab" class="tab-content hidden">
      <h3 class="title is-5">Scan Item</h3>
      <div id="qr-reader" style="width:300px"></div>
      <p id="qr-result"></p>
      <button class="button is-primary" onclick="startScanner()">Start Scan</button>
      <button class="button is-danger" onclick="stopScanner()">Stop Scan</button>
    </div>

    <!-- Users Tab -->
    <div id="usersTab" class="tab-content hidden">
      <h3 class="title is-5">User Management</h3>
      <div class="table-container">
        <table class="table is-striped is-fullwidth">
          <thead>
            <tr>
              <th>Username</th>
              <th>Role</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="usersTableBody"></tbody>
        </table>
      </div>
      <h4 class="title is-6">Add User</h4>
      <div class="field">
        <label class="label">Username</label>
        <div class="control">
          <input class="input" id="newUsername">
        </div>
      </div>
      <div class="field">
        <label class="label">PIN</label>
        <div class="control">
          <input class="input" id="newPin" type="password">
        </div>
      </div>
      <div class="field">
        <label class="label">Role</label>
        <div class="control">
          <div class="select">
            <select id="newRole">
              <option value="foreman">Foreman</option>
              <option value="driver">Driver</option>
              <option value="yard">Yard</option>
              <option value="admin">Admin</option>
            </select>
          </div>
        </div>
      </div>
      <button class="button is-primary" onclick="addUser()">Add User</button>
    </div>
  </div>

  <script>
    // Default users and inventory for initial load
    const defaultUsers = [
      { username: 'admin', pin: '1234', role: 'admin' },
      { username: 'foreman1', pin: '1111', role: 'foreman' },
      { username: 'driver1', pin: '2222', role: 'driver' },
      { username: 'yard1', pin: '3333', role: 'yard' }
    ];

    const defaultInventory = [
      { name:'Doka Framax Xlife Panel', size:'90x150', quantity:20, site:'Main Yard', acquisitionDate:'2025-01-10', acquisitionCost:120, isRented:false, rentalStartDate:'', rentalRate:0 },
      { name:'Doka Frami Xlife Panel', size:'90x150', quantity:10, site:'Site A', acquisitionDate:'2025-01-15', acquisitionCost:110, isRented:false, rentalStartDate:'', rentalRate:0 },
      { name:'Doka H20 Beam', size:'3.9m', quantity:50, site:'Main Yard', acquisitionDate:'2025-02-15', acquisitionCost:40, isRented:false, rentalStartDate:'', rentalRate:0 },
      { name:'Prop P3', size:'2.5-3m', quantity:100, site:'Main Yard', acquisitionDate:'2025-03-01', acquisitionCost:30, isRented:false, rentalStartDate:'', rentalRate:0 },
      { name:'Peri TRIO Panel', size:'3m', quantity:30, site:'Site B', acquisitionDate:'2025-03-10', acquisitionCost:150, isRented:true, rentalStartDate:'2025-10-01', rentalRate:10 },
      { name:'Battery Impact Driver', size:'Hilti', quantity:10, site:'Main Yard', acquisitionDate:'2025-04-20', acquisitionCost:200, isRented:false, rentalStartDate:'', rentalRate:0 },
      { name:'Nails', size:'75mm (box)', quantity:0, site:'Main Yard', acquisitionDate:'2025-01-05', acquisitionCost:5, isRented:false, rentalStartDate:'', rentalRate:0 },
      { name:'Doka Prop P4', size:'3-4m', quantity:0, site:'Main Yard', acquisitionDate:'', acquisitionCost:0, isRented:false, rentalStartDate:'', rentalRate:0 }
    ];

    let users = JSON.parse(localStorage.getItem('users')) || defaultUsers;
    let inventory = JSON.parse(localStorage.getItem('inventory')) || defaultInventory;
    let currentUser = null;
    let hideZero = false;
    let scanner = null;

    function saveData() {
      localStorage.setItem('users', JSON.stringify(users));
      localStorage.setItem('inventory', JSON.stringify(inventory));
    }

    function login() {
      const username = document.getElementById('username').value;
      const pin = document.getElementById('pin').value;
      const user = users.find(u => u.username === username && u.pin === pin);
      if (user) {
        currentUser = user;
        document.getElementById('login').classList.add('hidden');
        document.getElementById('dashboard').classList.remove('hidden');
        buildNavTabs();
        loadInventory();
        loadUsers();
      } else {
        alert('Invalid credentials');
      }
    }

    function buildNavTabs() {
      const nav = document.getElementById('navTabs');
      nav.innerHTML = '';
      const tabs = [
        { id:'inventoryTab', label:'Inventory' },
        { id:'addItemTab', label:'AddItem' },
        { id:'requestTab', label:'Request' },
        { id:'scanTab', label:'Scan' }
      ];
      if (currentUser.role === 'admin') {
        tabs.push({ id:'usersTab', label:'Users' });
      }
      tabs.forEach((tab, index) => {
        const li = document.createElement('li');
        const a = document.createElement('a');
        a.textContent = tab.label;
        a.onclick = () => showTab(tab.id);
        li.appendChild(a);
        if (index === 0) li.classList.add('is-active');
        nav.appendChild(li);
      });
      showTab(tabs[0].id);
    }

    function showTab(tabId) {
      const contents = document.querySelectorAll('.tab-content');
      contents.forEach(c => c.classList.add('hidden'));
      document.getElementById(tabId).classList.remove('hidden');
      const navLinks = document.querySelectorAll('#navTabs li');
      navLinks.forEach(li => li.classList.remove('is-active'));
      const tabMap = { 'inventoryTab':0, 'addItemTab':1, 'requestTab':2, 'scanTab':3, 'usersTab':4 };
      const index = tabMap[tabId];
      if (navLinks[index]) navLinks[index].classList.add('is-active');
      if (tabId !== 'scanTab') stopScanner();
    }

    function loadInventory() {
      const tbody = document.getElementById('inventoryTableBody');
      tbody.innerHTML = '';
      inventory.forEach((item, idx) => {
        if (hideZero && item.quantity == 0) return;
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${item.name}</td>
          <td>${item.size || ''}</td>
          <td>${item.quantity}</td>
          <td>${item.site || ''}</td>
          <td>${item.acquisitionDate || ''}</td>
          <td>${item.acquisitionCost || 0}</td>
          <td>${item.isRented ? 'Yes' : 'No'}</td>
          <td>${item.rentalStartDate || ''}</td>
          <td>${item.rentalRate || 0}</td>
          <td>${calculateRentalCost(item)}</td>
          <td><button class="button is-small is-danger" onclick="removeItem(${idx})">Remove</button></td>
        `;
        tbody.appendChild(tr);
      });
    }

    function calculateRentalCost(item) {
      if (item.isRented && item.rentalStartDate && item.rentalRate) {
        const start = new Date(item.rentalStartDate);
        const now = new Date();
        const ms = now - start;
        const days = Math.floor(ms / (1000 * 60 * 60 * 24));
        return (days * item.rentalRate).toFixed(2);
      }
      return '0.00';
    }

    function toggleHideZero() {
      hideZero = document.getElementById('hideZeroCheckbox').checked;
      loadInventory();
    }

    function toggleRentalFields() {
      const checked = document.getElementById('itemIsRented').checked;
      document.getElementById('rentalStartField').style.display = checked ? 'block' : 'none';
      document.getElementById('rentalRateField').style.display = checked ? 'block' : 'none';
    }

    function addItem() {
      const name = document.getElementById('itemName').value;
      const size = document.getElementById('itemSize').value;
      const qty = parseInt(document.getElementById('itemQty').value) || 0;
      const site = document.getElementById('itemSite').value || 'Main Yard';
      const acqDate = document.getElementById('itemAcqDate').value;
      const acqCost = parseFloat(document.getElementById('itemAcqCost').value) || 0;
      const isRented = document.getElementById('itemIsRented').checked;
      const rentalStart = document.getElementById('itemRentalStart').value;
      const rentalRate = parseFloat(document.getElementById('itemRentalRate').value) || 0;
      if (!name) { alert('Name is required'); return; }
      inventory.push({
        name: name,
        size: size,
        quantity: qty,
        site: site,
        acquisitionDate: acqDate,
        acquisitionCost: acqCost,
        isRented: isRented,
        rentalStartDate: isRented ? rentalStart : '',
        rentalRate: isRented ? rentalRate : 0
      });
      saveData();
      loadInventory();
      document.getElementById('itemName').value = '';
      document.getElementById('itemSize').value = '';
      document.getElementById('itemQty').value = '';
      document.getElementById('itemSite').value = '';
      document.getElementById('itemAcqDate').value = '';
      document.getElementById('itemAcqCost').value = '';
      document.getElementById('itemIsRented').checked = false;
      document.getElementById('itemRentalStart').value = '';
      document.getElementById('itemRentalRate').value = '';
      toggleRentalFields();
    }

    function removeItem(index) {
      if (confirm('Remove this item?')) {
        inventory.splice(index, 1);
        saveData();
        loadInventory();
      }
    }

    function requestDelivery() {
      const itemName = document.getElementById('requestItemName').value;
      const qty = document.getElementById('requestQty').value;
      const date = document.getElementById('requestDate').value;
      if (!itemName || !qty || !date) {
        alert('Please fill all fields');
        return;
      }
      alert('Delivery request submitted for ' + qty + 'x ' + itemName + ' on ' + date);
      document.getElementById('requestItemName').value = '';
      document.getElementById('requestQty').value = '';
      document.getElementById('requestDate').value = '';
    }

    function loadUsers() {
      if (!currentUser || currentUser.role !== 'admin') return;
      const tbody = document.getElementById('usersTableBody');
      tbody.innerHTML = '';
      users.forEach((user, idx) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${user.username}</td>
          <td>${user.role}</td>
          <td>
            <button class="button is-small is-info" onclick="editUser(${idx})">Edit</button>
            <button class="button is-small is-danger" onclick="removeUser(${idx})">Remove</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function addUser() {
      const username = document.getElementById('newUsername').value;
      const pin = document.getElementById('newPin').value;
      const role = document.getElementById('newRole').value;
      if (!username || !pin) {
        alert('Username and PIN are required');
        return;
      }
      users.push({ username: username, pin: pin, role: role });
      saveData();
      loadUsers();
      document.getElementById('newUsername').value = '';
      document.getElementById('newPin').value = '';
      document.getElementById('newRole').value = 'foreman';
    }

    function editUser(index) {
      const newPin = prompt('Enter new PIN for ' + users[index].username);
      if (newPin) {
        users[index].pin = newPin;
        const newRole = prompt('Enter new role (foreman, driver, yard, admin)', users[index].role);
        if (newRole) {
          users[index].role = newRole;
          saveData();
          loadUsers();
        }
      }
    }

    function removeUser(index) {
      if (confirm('Remove this user?')) {
        users.splice(index, 1);
        saveData();
        loadUsers();
      }
    }

    function startScanner() {
      const qrReader = document.getElementById('qr-reader');
      document.getElementById('qr-result').textContent = '';
      if (!scanner) {
        scanner = new Html5Qrcode('qr-reader');
      }
      scanner.start(
        { facingMode: 'environment' },
        {
          fps: 10,
          qrbox: 250
        },
        (decodedText) => {
          document.getElementById('qr-result').textContent = 'Scanned: ' + decodedText;
          scanner.stop();
        },
        (error) => {
          console.log(error);
        }
      ).catch((err) => {
        console.log(err);
      });
    }

    function stopScanner() {
      if (scanner) {
        scanner.stop().catch((err) => { console.log(err); });
      }
    }
  </script>
</body>
</html>
